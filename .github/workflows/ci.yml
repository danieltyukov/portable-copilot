name: CI

# Standard GitHub-hosted runners only. Actions minutes are free and unmetered on
# a public repository with standard runners.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A second push to the same branch cancels the first.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A stick is plugged into all three, and paths, consoles, the clipboard
        # and process handling differ on each.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.10 is the oldest Python a checkout supports; 3.12 is what the stick
        # bundles.
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The app's whole dependency list plus pytest. No pip cache: three small
      # pure-Python packages install faster than a cache restores. The tests
      # need no model server and no network.
      - run: python -m pip install rich prompt_toolkit pytest

      - run: python -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned, so a new ruff release cannot fail CI on code nobody touched.
      # The rules are in pyproject.toml: pyflakes and pycodestyle errors, with
      # long lines and one-line `a; b` statements allowed.
      - run: python -m pip install ruff==0.16.10
      - run: ruff check sparky tests tools

      # shellcheck comes preinstalled on the Ubuntu runner. Warnings and errors
      # only: the style notes below that level would churn working scripts.
      - run: shellcheck -S warning *.sh start.command tools/*.sh

      # The docs and the code are written without em dashes, en dashes or
      # emojis, and this keeps it that way. "Emoji" means a character drawn as
      # a colour picture by default (Unicode's Emoji_Presentation) or one forced
      # into it by U+FE0F. Symbols a terminal draws as plain text, such as the
      # check mark U+2713 and the warning sign U+26A0, are allowed.
      - name: No em dashes, en dashes or emojis
        shell: python
        run: |
          import os
          import subprocess
          import sys

          DIRS = ("docs/", "site/", "sparky/", "tools/", ".github/")
          SKIP = (".png", ".jpg", ".ico", ".woff2")
          DASHES = {0x2013: "en dash", 0x2014: "em dash"}
          # Emoji_Presentation code points below U+1F000. Everything from
          # U+1F000 to U+1FAFF is checked as a block.
          BMP_EMOJI = [
              (0x231A, 0x231B), (0x23E9, 0x23EC), (0x23F0, 0x23F0), (0x23F3, 0x23F3),
              (0x25FD, 0x25FE), (0x2614, 0x2615), (0x2648, 0x2653), (0x267F, 0x267F),
              (0x2693, 0x2693), (0x26A1, 0x26A1), (0x26AA, 0x26AB), (0x26BD, 0x26BE),
              (0x26C4, 0x26C5), (0x26CE, 0x26CE), (0x26D4, 0x26D4), (0x26EA, 0x26EA),
              (0x26F2, 0x26F3), (0x26F5, 0x26F5), (0x26FA, 0x26FA), (0x26FD, 0x26FD),
              (0x2705, 0x2705), (0x270A, 0x270B), (0x2728, 0x2728), (0x274C, 0x274C),
              (0x274E, 0x274E), (0x2753, 0x2755), (0x2757, 0x2757), (0x2795, 0x2797),
              (0x27B0, 0x27B0), (0x27BF, 0x27BF), (0x2B1B, 0x2B1C), (0x2B50, 0x2B50),
              (0x2B55, 0x2B55),
          ]


          def problem(c):
              if c in DASHES:
                  return DASHES[c]
              if c == 0xFE0F or 0x1F000 <= c <= 0x1FAFF or any(a <= c <= b for a, b in BMP_EMOJI):
                  return "emoji"
              return None


          listed = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout
          failed = False
          for path in listed.decode("utf-8").split("\0"):
              if not path or path.endswith(SKIP):
                  continue
              if not (path.endswith(".md") or path.startswith(DIRS)) or not os.path.isfile(path):
                  continue
              with open(path, "rb") as fh:
                  data = fh.read()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  for ch in line:
                      what = problem(ord(ch))
                      if what:
                          print(f"{path}:{number}: {what} (U+{ord(ch):04X})")
                          failed = True
                          break
          sys.exit(1 if failed else 0)
