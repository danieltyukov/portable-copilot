<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="sparky-token" content="{{TOKEN}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFC61A" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1F1909" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <title>Sparky</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <!-- theme-init.js runs before the first paint so a saved theme never
       flashes the other one; app.js waits for the page. No inline script:
       the server's Content-Security-Policy allows only files from here. -->
  <script src="/static/theme-init.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#input">Skip to the message box</a>

  <header class="top">
    <div class="top-row">
      <h1 class="brand">
        <span class="tile"><img src="/static/icon.svg" width="26" height="26" alt=""></span>
        <span>Sparky</span>
      </h1>

      <div class="settings" role="group" aria-label="Chat settings">
        <div class="field field-model">
          <label for="model">Model</label>
          <span class="select"><select id="model" class="key" disabled><option>Loading</option></select></span>
        </div>
        <div class="field field-mode">
          <label for="mode">Mode</label>
          <span class="select"><select id="mode" class="key" disabled><option>Loading</option></select></span>
        </div>
        <button id="think" class="key toggle" type="button" aria-pressed="false"
                title="Let the model reason before it answers. Slower, sometimes better. Not every model can.">
          <span class="led" aria-hidden="true"></span>Thinking
        </button>
        <span id="yolo" class="badge" hidden title="Shell commands run without asking you first.">Runs commands unasked</span>
      </div>

      <div class="actions">
        <button id="new" class="key" type="button">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><path d="M10 3.5v13M3.5 10h13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <span class="new-label">New chat</span>
        </button>
        <button id="theme" class="key key-icon" type="button" aria-label="Switch theme">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 2.75a7.25 7.25 0 0 1 0 14.5z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="main">
    <section id="empty" class="empty" aria-labelledby="empty-title" hidden>
      <span class="tile tile-big"><img src="/static/icon.svg" width="76" height="76" alt=""></span>
      <h2 id="empty-title">What do you want to do?</h2>
      <p id="empty-sub" class="empty-sub"></p>
      <ul class="chips" aria-label="Suggestions">
        <li><button class="key chip" type="button" data-fill="Explain this error message and how to fix it:&#10;&#10;">Explain this error message</button></li>
        <li><button class="key chip" type="button" data-fill="Draft a polite email declining a meeting. Keep it short and friendly.">Draft a polite email declining a meeting</button></li>
        <li><button class="key chip" type="button" data-fill="Summarise the files in my context folder.">Summarise the files in my context folder</button></li>
        <li><button class="key chip" type="button" data-fill="Write a Python script that renames the photos in a folder by the date they were taken.">Write a Python script that renames photos by date</button></li>
      </ul>
    </section>

    <div id="log" class="log" role="log" aria-live="polite" aria-label="Conversation"></div>
  </main>

  <footer class="composer">
    <form id="form" class="composer-inner" autocomplete="off">
      <ul id="thumbs" class="thumbs" aria-label="Attached images" hidden></ul>
      <p id="vision" class="vision-hint" hidden></p>
      <div class="box">
        <button id="attach" class="key key-icon" type="button" aria-label="Attach images">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><rect x="2.75" y="3.75" width="14.5" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7.2" cy="8" r="1.5" fill="currentColor"/><path d="M3.5 14.5l4.2-4 3 2.8 2.3-2 3.5 3.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <input id="file" type="file" accept="image/*" multiple hidden>
        <label for="input" class="visually-hidden">Message to Sparky</label>
        <textarea id="input" rows="1" placeholder="Message Sparky" enterkeyhint="send" spellcheck="true"></textarea>
        <button id="send" class="key key-primary" type="submit">
          <span class="when-idle">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><path d="M10 16V4.5M4.75 9.5L10 4.25l5.25 5.25" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Send</span>
          </span>
          <span class="when-busy">
            <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" focusable="false"><rect x="4" y="4" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
            <span>Stop</span>
          </span>
        </button>
      </div>
      <p class="foot">
        <span class="when-idle">Enter sends, Shift+Enter adds a line.</span>
        <span class="when-busy">Esc or Stop ends the reply.</span>
        <span id="version" class="version"></span>
      </p>
    </form>
  </footer>

  <div id="drop" class="drop" hidden><p>Drop images to attach them</p></div>
  <div id="status" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
